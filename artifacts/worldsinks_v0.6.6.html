    // =========================
    // core/gameLogic.js

    const GAME = {
      rowFullTimers: {},
      spawnHumans: () => {
        let h = []; let vip = Math.floor(Math.random()*50); for(let i=0; i<50; i++) h.push(new Human(i, 130+40+Math.random()*4*40, 0, i===vip));
        h.forEach(human => human.y = human.getStandingY(Math.round((human.x-130)/40), 0)-26);
        STATE.setHumans(h); STATE.setAllHumans([...h]);
      },
      startGameOver: () => { if (STATE.state!=="gameover") { STATE.setState("gameover"); STATE.setGameoverStart(STATE.elapsed); STATE.setGameoverCameraY(WORLD.cameraY); BLOCK.setPair(null); STATE.setGravityActive(false); } },
      update: (dt) => {
        STATE.addElapsed(dt); if(STATE.debugMessageTimer>0) STATE.setDebugMessageTimer(STATE.debugMessageTimer-dt);
        EFFECTS.updateRain(dt); EFFECTS.updateThunder(dt); EFFECTS.updateShake(dt); WORLD.updateSafe();
        if (["playing", "goal_wait", "gameover", "clear"].includes(STATE.state)) {
          let rem = [], sm = STATE.state==="goal_wait"?2.5:1.0; STATE.humans.forEach(h => { h.update(dt*sm); if(h.y<=(WORLD.cameraY+12+10)*40) rem.push(h); }); STATE.setHumans(rem);
          if (rem.length===0 && STATE.state==="playing") { GAME.startGameOver(); return; }
          GAME.updateRescue(dt);
        }
        if (STATE.state==="clear") { if(!STATE.clearCelebrationFired && STATE.elapsed-STATE.clearStart>=2.4) { EFFECTS.spawnClearCelebration(); STATE.setClearCelebrationFired(true); } EFFECTS.updateCelebrationEffects(); return; }
        if (STATE.state==="gameover") { WORLD.setCameraY(STATE.gameoverCameraY); for(let i=0; i<6; i++) COLLAPSE.forceGravity(); WORLD.setWater(Math.min(WORLD.water + dt*0.15*10, (200-WORLD.cameraY)+2)); return; }
        if (STATE.state==="goal_wait") { let all=true; let gy=(200-20/10-1.5)*40; STATE.humans.forEach(h=>{if(h.y>gy)all=false;}); if(all){ STATE.setState("clear"); let s=0; STATE.humans.forEach(h=>{s+=h.isVIP?500:100; h.state='goal'; h.timer=2.0; h.goalSubState=0; h.say("GOAL");}); SCORE.addScore(s); STATE.setClearStart(STATE.elapsed); } return; }
        if (STATE.state!=="playing") return; if (STATE.state==="playing" && STATE.floodPhase==="blink") { GAME.updateFloodGrace(dt); return; }
        if (!STATE.debugPauseWater) WORLD.setWater(WORLD.water + dt*0.15); GAME.updateBombs(dt);
        if (Math.round((199-STATE.renderSafeLine-2)*10)>=200 && !STATE.gravityActive) { STATE.setState("goal_wait"); BLOCK.setPair(null); }
        if (WORLD.water*10 >= WORLD.heightMeters()) GAME.startFloodGrace(); else GAME.resetFloodGrace();
        GAME.updateFloodGrace(dt); if (STATE.state!=="playing") return;
        if (BLOCK.pair) BLOCK.updatePairRender(); if (STATE.gravityActive) COLLAPSE.updateCascade(dt); GAME.updateCrackingBlocks(dt);
        if (!STATE.nextPair && STATE.spawnEnabled) STATE.setNextPair(BLOCK.newPair());
        if (!BLOCK.pair && STATE.spawnEnabled && STATE.nextPair) { BLOCK.setPair(STATE.nextPair); STATE.setNextPair(BLOCK.newPair()); }
        BLOCK.addDrop(dt); let sp = BLOCK.fast?0.05:0.6; if (BLOCK.drop > sp) { BLOCK.setDrop(0); BLOCK.pair.y++; if(BLOCK.hit(BLOCK.blocks(BLOCK.pair))) { BLOCK.pair.y--; BLOCK.merge(); BLOCK.setPair(null); if(!STATE.gravityActive) COLLAPSE.startCascade(); else COLLAPSE.setupGravity(); } }
        STATE.setRenderSafeLine(STATE.renderSafeLine + (WORLD.safeLine-STATE.renderSafeLine)*0.15); WORLD.setTargetCameraY(Math.max(0, Math.min(200-12, (STATE.renderSafeLine+1)-(12-3)))); WORLD.setCameraY(WORLD.cameraY + (WORLD.targetCameraY-WORLD.cameraY)*0.05);
      },
      updateFloodGrace: (dt) => {
        if (STATE.floodPhase==="none") return;
        if (STATE.floodPhase==="blink") { STATE.setCautionAnimTimer(Math.max(0, STATE.cautionAnimTimer-dt)); if(STATE.cautionAnimTimer<=0) { STATE.setFloodPhase("countdown"); STATE.setFloodCountdownEnd(STATE.elapsed+10); } return; }
        const r = Math.max(0, STATE.floodCountdownEnd-STATE.elapsed); STATE.setCurrentPhase(r>7?1:(r>4?2:(r>2?3:4))); if(r<=0) GAME.startGameOver();
      },
      startFloodGrace: () => { if(STATE.floodPhase==="none") { STATE.setLimitWarningUntil(0); STATE.setFloodPhase("blink"); STATE.setFloodBlinkStart(STATE.elapsed); STATE.setCautionAnimTimer(1.5); } },
      resetFloodGrace: () => { STATE.setFloodPhase("none"); STATE.setCurrentPhase(0); },
      updateBombs: (dt) => {
        if (STATE.elapsed-STATE.lastBombCheck >= 5) {
          STATE.setLastBombCheck(STATE.lastBombCheck+5); const m = WORLD.heightMeters();
          if (m>=0) { let p = Math.min(10, Math.floor(m/10)*50); if(Math.random()<p/100) STATE.fallingBombs.push({x: Math.floor(Math.random()*6), y: WORLD.cameraY-2, timer: 10+Math.random()*20}); }
        }
        for (let i = STATE.fallingBombs.length-1; i>=0; i--) {
          let b = STATE.fallingBombs[i], ny = b.y + 3*dt, vt = 200;
          for(let y=0;y<200;y++) if(WORLD.grid[y][b.x]){vt=y+((typeof WORLD.grid[y][b.x]==='object'&&WORLD.grid[y][b.x].renderOffsetY)?WORLD.grid[y][b.x].renderOffsetY:0); break;}
          if (ny+1 >= vt) { let py = Math.floor(vt)-1; if(py>=0) { WORLD.grid[py][b.x] = {type:'bomb', timer:b.timer}; if(!STATE.gravityActive) COLLAPSE.startCascade(); else COLLAPSE.setupGravity(); COLLAPSE.applyLimit(); } STATE.fallingBombs.splice(i,1); } else b.y = ny;
        }
        let exp = false; for(let y=0;y<200;y++) for(let x=0;x<6;x++) {
          let c = WORLD.grid[y][x]; if(typeof c==='object'&&c.type==='bomb'&&c.state!=='cracking'){ if(!STATE.debugPauseCracking) c.timer-=dt; if(c.timer<=0){ for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){ let ny=y+dy,nx=x+dx; if(nx>=0&&nx<6&&ny>=0&&ny<200&&WORLD.grid[ny][nx]!==9){ if(WORLD.grid[ny][nx]) EFFECTS.spawnParticles(nx,ny,(typeof WORLD.grid[ny][nx]==='number')?CONST.COLORS[WORLD.grid[ny][nx]]:"#f30"); WORLD.grid[ny][nx]=0; STATE.humans.forEach(h=>h.onBlockBroken(nx,ny)); } } exp=true; } }
        } if(exp){ if(!STATE.gravityActive) COLLAPSE.startCascade(); else COLLAPSE.setupGravity(); }
      },
      updateCrackingBlocks: (dt) => {
        if(STATE.debugPauseCracking) return; if(!STATE.gravityActive){
          let fin = false; for(let y=0;y<200;y++) for(let x=0;x<6;x++){
            let c = WORLD.grid[y][x]; if(c&&typeof c==='object'&&c.state==='cracking'){ let k=c.type==='bomb'?'crackTimer':'timer'; c[k]-=dt; if(c[k]<=0){ if(c.type==='bomb') GAME.checkBombDamage(x,y); EFFECTS.spawnParticles(x,y,c.type==='bomb'?"#555":CONST.COLORS[c.color]); WORLD.grid[y][x]=0; fin=true; } }
          } if(fin) COLLAPSE.startCascade();
        }
      },
      checkBombDamage: (bx, by) => {
        const wx = bx*40+130+20, wy = by*40+20, rad = 40*1.5;
        STATE.humans.forEach(h => { if(!h.isDead && Math.sqrt(Math.pow(h.x-wx,2)+Math.pow(h.y+13-wy,2)) < rad) h.die('bomb'); });
      },
      updateRescue: (dt) => {
        if(!CONST.HUMAN_RESCUE_ENABLED || STATE.state!=="playing") return;
        for(let y=Math.floor(STATE.renderSafeLine); y<200; y++) {
          let full = true; for(let x=0;x<6;x++) if(!WORLD.grid[y][x] || WORLD.grid[y][x]===9 || (typeof WORLD.grid[y][x]==='object'&&!WORLD.grid[y][x].isCracked)) { full=false; break; }
          if (full) {
            let hs = STATE.humans.filter(h => Math.floor((h.y+26-2)/40) === y+1);
            if (hs.length>0) {
              GAME.rowFullTimers[y] = (GAME.rowFullTimers[y]||0)+dt;
              if (GAME.rowFullTimers[y]>=15) { let v=hs[0]; if(v.state!=='climb_cracked'&&v.state!=='shock') { v.state='climb_cracked'; STATE.showDebugMessage(`RESCUE: Floor ${y} opened`); GAME.rowFullTimers[y]=0; } }
            } else GAME.rowFullTimers[y]=0;
          } else GAME.rowFullTimers[y]=0;
        }
      }
    };

    // core/input.js
    // =========================
    function setupInput() {
      const cv = document.querySelector('canvas');
      cv.addEventListener("mousedown", e => { if(STATE.state==="human_edit") { const r=cv.getBoundingClientRect(); EDITOR.handleEditorClick((e.clientX-r.left)*(cv.width/r.width), (e.clientY-r.top)*(cv.height/r.height)); } });
      window.addEventListener("keydown", e => {
        if(STATE.state==="human_edit"){ if(e.key==="ArrowLeft")EDITOR.prevPage(); if(e.key==="ArrowRight")EDITOR.nextPage(); if(e.key==="Escape"||e.key==="q"||e.key==="Q")STATE.setState("title"); return; }
        if(STATE.state==="title"){ if(e.code==="Digit1"){EDITOR.initEditor(); return;} if(e.code==="Space"&&STATE.spaceReleased){STATE.setState("intro"); STATE.setElapsed(0); STATE.setSpaceReleased(false);} return; }
        if(STATE.state==="intro"){ if(e.code==="Space"&&STATE.spaceReleased){STATE.resetGame(); BLOCK.setPair(null); WORLD.updateSafe(); STATE.setRenderSafeLine(WORLD.safeLine); GAME.spawnHumans(); STATE.setState("playing"); STATE.setElapsed(0); STATE.setSpaceReleased(false);} return; }
        if((STATE.state==="clear"||STATE.state==="gameover")){ if(e.code==="Space"&&STATE.spaceReleased){STATE.resetGame(); BLOCK.setPair(null); WORLD.updateSafe(); STATE.setRenderSafeLine(WORLD.safeLine); RENDER.resetClouds(); STATE.setState("title"); STATE.setElapsed(0); STATE.setSpaceReleased(false);} return; }
        if(e.code==="Space"){STATE.setSpaceReleased(false); return;}
        if(e.key==="6"){const al=STATE.humans.filter(h=>!h.isDead); if(al.length>0){al[Math.floor(Math.random()*al.length)].die('none'); STATE.showDebugMessage("DEBUG: Human Died");}}
        if(e.key==="7"){STATE.setSpawnEnabled(!STATE.spawnEnabled); STATE.showDebugMessage("SPAWN: "+(STATE.spawnEnabled?"ON":"OFF"));}
        if(e.code==="KeyQ"&&STATE.state==="playing"){STATE.setIsPaused(!STATE.isPaused); return;}
        if(STATE.state==="playing"){
          if(e.code==="Digit1"||e.code==="Numpad1"){STATE.fallingBombs.push({x:Math.floor(Math.random()*6),y:WORLD.cameraY-2,timer:10+Math.random()*20}); STATE.showDebugMessage("BOMB SPAWNED!");}
          if(e.code==="Digit2"||e.code==="Numpad2"){STATE.setDebugPauseCracking(!STATE.debugPauseCracking); STATE.showDebugMessage(STATE.debugPauseCracking?"CRACK PAUSED":"CRACK RESUMED");}
          if(e.code==="Digit3"||e.code==="Numpad3"){STATE.setDebugPauseWater(!STATE.debugPauseWater); STATE.showDebugMessage(STATE.debugPauseWater?"WATER PAUSED":"WATER RESUMED");}
          if(e.code==="Digit4"||e.code==="Numpad4"){WORLD.setWater(Math.max(-1,WORLD.water-5)); STATE.showDebugMessage("WATER -50m");}
          if(e.code==="Digit5"||e.code==="Numpad5"){WORLD.setWater(WORLD.water+5); STATE.showDebugMessage("WATER +50m");}
        }
        if(STATE.state!=="playing"||STATE.isPaused||!BLOCK.pair) return;
        if(e.key==="ArrowLeft"){BLOCK.pair.x--; if(BLOCK.hit(BLOCK.blocks(BLOCK.pair)))BLOCK.pair.x++;}
        if(e.key==="ArrowRight"){BLOCK.pair.x++; if(BLOCK.hit(BLOCK.blocks(BLOCK.pair)))BLOCK.pair.x--;}
        if(e.key==="ArrowUp"){const pr=BLOCK.pair.rot, px=BLOCK.pair.x; BLOCK.pair.rot=(BLOCK.pair.rot+1)%4; if(BLOCK.hit(BLOCK.blocks(BLOCK.pair))){let ok=false; for(let dx of [-1,1,-2,2]){BLOCK.pair.x=px+dx; if(!BLOCK.hit(BLOCK.blocks(BLOCK.pair))){ok=true; break;}} if(!ok){BLOCK.pair.rot=pr; BLOCK.pair.x=px;}}}
        if(e.key==="ArrowDown")BLOCK.setFast(true); if(e.key==="r"||e.key==="R")STATE.setRadarAbstractionMode(!STATE.radarAbstractionMode);
      });
      document.addEventListener("keyup", e=>{if(e.code==="Space")STATE.setSpaceReleased(true); if(e.key==="ArrowDown")BLOCK.setFast(false);});
    }

    // =========================
    // core/gameLoop.js
    // =========================
    let last = 0, fCount = 0, lastFps = 0;
    function loop(t = 0) {
      const dt_ms = t - last; if (dt_ms < 1000/60) { requestAnimationFrame(loop); return; }
      let dt = Math.min(0.1, dt_ms/1000); last = t; fCount++;
      if(t-lastFps>1000){ STATE.setFps(Math.round(fCount*1000/(t-lastFps))); fCount=0; lastFps=t; }
      if(!STATE.isPaused){ GAME.update(dt); if(!(STATE.state==="playing"&&STATE.floodPhase==="blink")) EFFECTS.updateParticles(); }
      RENDER.draw(dt); requestAnimationFrame(loop);
    }

    // --- Init ---
    window.onload = () => {
      const canvas = document.getElementById("game"); canvas.width = 590; canvas.height = 480;
      RENDER.resetClouds(); setupInput(); loop();
    };
  </script>
</body>
